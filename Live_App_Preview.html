<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drapes & Fitouts - App Live Preview</title>
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        .controls {
            margin-bottom: 20px;
            background: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls button {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .controls button:hover, .controls button.active {
            background-color: #3498db;
        }
        .phone-mockup {
            background-color: #000;
            border-radius: 40px;
            padding: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            position: relative;
            display: flex;
            flex-direction: column;
            transition: all 0.4s ease;
        }
        /* Device Sizes */
        .device-iphone { width: 375px; height: 812px; }
        .device-android { width: 412px; height: 915px; } /* e.g. S21 Ultra */
        .device-ipad { width: 768px; height: 1024px; border-radius: 20px; }
        .device-desktop { width: 1200px; height: 800px; border-radius: 10px; }
        .notch {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 30px;
            background-color: #000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 10;
            transition: 0.3s;
        }
        /* Container to hide scrollbar */
        .iframe-container {
            width: 100%;
            height: 100%;
            flex-grow: 1;
            border-radius: 25px;
            background-color: #fff;
            overflow: hidden; /* This hides the scrollbar */
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Hide scrollbar trick for mobile views: make iframe wider to push scrollbar out of view */
        .phone-mockup:not(.device-desktop) iframe {
            width: calc(100% + 18px); /* Windows scrollbar is ~17px */
            padding-right: 0px;
        }
        /* Adjustments for non-phones */
        .phone-mockup.device-ipad .notch, .phone-mockup.device-desktop .notch {
            display: none;
        }
        .phone-mockup.device-ipad .iframe-container, .phone-mockup.device-desktop .iframe-container {
            border-radius: 10px;
        }
        
        /* For desktop, we don't hide the scrollbar */
        .phone-mockup.device-desktop .iframe-container {
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="setDevice('device-iphone')" id="btn-iphone" class="active">iPhone (iOS)</button>
        <button onclick="setDevice('device-android')" id="btn-android">Android Phone</button>
        <button onclick="setDevice('device-ipad')" id="btn-ipad">iPad / Tablet</button>
        <button onclick="setDevice('device-desktop')" id="btn-desktop">Desktop</button>
    </div>
    <div class="phone-mockup device-iphone" id="mockup">
        <div class="notch" id="notch"></div>
        <!-- Wrapping iframe to hide the scrollbar -->
        <div class="iframe-container">
            <iframe src="https://drapes-and-fitouts.replit.app/"></iframe>
        </div>
    </div>
    <script>
        function setDevice(deviceClass) {
            // Update mockup class
            const mockup = document.getElementById('mockup');
            mockup.className = 'phone-mockup ' + deviceClass;
            
            // Update active button state
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + deviceClass.split('-')[1]).classList.add('active');
        }
    </script>
</body>
</html>
